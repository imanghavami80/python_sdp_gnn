[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-project"
version = "0.1.0"
description = "Master thesis project scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Iman" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "javalang>=0.13.0",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
