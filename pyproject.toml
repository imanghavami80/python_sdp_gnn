[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-project"
version = "0.1.0"
description = "Multi-view graph neural network pipeline for cross-project software defect prediction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Iman" }
]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
